<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">Evaluation, evidence context, and safeguards across 54 reports</title><desc id="figure-description">Horizontal bars show report counts. Prospective-only and mixed retrospective-prospective temporality each occur in one of 46 applicable reports; their percentages are 2.2%. All other percentages use 54 reports. A zero count indicates no confirmed positive classification, not proof of absence.</desc><rect width="1200" height="1100" fill="white" /><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}.title{font-size:25px;font-weight:700}.head{font-size:19px;font-weight:700}.lab{font-size:16px}.val{font-size:16px;font-weight:700}.note{font-size:14px;fill:#536575}</style><text x="50" y="45" class="title">Evaluation, evidence context, and safeguards</text><text x="50" y="72" class="note">Report-level counts</text><rect x="35" y="100" width="1130" height="265" fill="white" stroke="#cbd5dd" /><text x="55" y="130" class="head">A. Evaluation methods</text><line x1="380.000" y1="160" x2="380.000" y2="342" stroke="#d9e1e8" /><text x="373.000" y="153" class="note">0</text><line x1="591.667" y1="160" x2="591.667" y2="342" stroke="#d9e1e8" /><text x="584.667" y="153" class="note">18</text><line x1="803.333" y1="160" x2="803.333" y2="342" stroke="#d9e1e8" /><text x="796.333" y="153" class="note">36</text><line x1="1015.000" y1="160" x2="1015.000" y2="342" stroke="#d9e1e8" /><text x="1008.000" y="153" class="note">54</text><text x="55" y="182" class="lab">Automated quantitative</text><rect x="380" y="166" width="635.000" height="20" fill="#2f6f9f" /><text x="1023.000" y="182" class="val">54 (100.0%)</text><text x="55" y="211" class="lab">Comparative or ablation</text><rect x="380" y="195" width="635.000" height="20" fill="#2f6f9f" /><text x="1023.000" y="211" class="val">54 (100.0%)</text><text x="55" y="240" class="lab">Human or expert assessment</text><rect x="380" y="224" width="599.722" height="20" fill="#2f6f9f" /><text x="987.722" y="240" class="val">51 (94.4%)</text><text x="55" y="269" class="lab">Citation/reference verification</text><rect x="380" y="253" width="341.019" height="20" fill="#2f6f9f" /><text x="729.019" y="269" class="val">29 (53.7%)</text><text x="55" y="298" class="lab">Stress or perturbation</text><rect x="380" y="282" width="317.500" height="20" fill="#2f6f9f" /><text x="705.500" y="298" class="val">27 (50.0%)</text><text x="55" y="327" class="lab">User or reader study</text><rect x="380" y="311" width="35.278" height="20" fill="#2f6f9f" /><text x="423.278" y="327" class="val">3 (5.6%)</text><rect x="35" y="385" width="1130" height="294" fill="white" stroke="#cbd5dd" /><text x="55" y="415" class="head">B. Evidence contexts</text><line x1="380.000" y1="445" x2="380.000" y2="656" stroke="#d9e1e8" /><text x="373.000" y="438" class="note">0</text><line x1="591.667" y1="445" x2="591.667" y2="656" stroke="#d9e1e8" /><text x="584.667" y="438" class="note">18</text><line x1="803.333" y1="445" x2="803.333" y2="656" stroke="#d9e1e8" /><text x="796.333" y="438" class="note">36</text><line x1="1015.000" y1="445" x2="1015.000" y2="656" stroke="#d9e1e8" /><text x="1008.000" y="438" class="note">54</text><text x="55" y="467" class="lab">Offline evaluation</text><rect x="380" y="451" width="564.444" height="20" fill="#268a8c" /><text x="952.444" y="467" class="val">48 (88.9%)</text><text x="55" y="496" class="lab">Simulated workflow</text><rect x="380" y="480" width="435.093" height="20" fill="#268a8c" /><text x="823.093" y="496" class="val">37 (68.5%)</text><text x="55" y="525" class="lab">Controlled workflow study</text><rect x="380" y="509" width="176.389" height="20" fill="#268a8c" /><text x="564.389" y="525" class="val">15 (27.8%)</text><text x="55" y="554" class="lab">Confirmed operational use</text><text x="388.000" y="554" class="val">0 (0.0%)</text><text x="55" y="583" class="lab">Prospective-only temporality*</text><rect x="380" y="567" width="11.759" height="20" fill="#268a8c" /><text x="399.759" y="583" class="val">1 (2.2%)</text><text x="55" y="612" class="lab">Mixed retrospective-prospective*</text><rect x="380" y="596" width="11.759" height="20" fill="#268a8c" /><text x="399.759" y="612" class="val">1 (2.2%)</text><text x="55" y="641" class="lab">Confirmed patient-care impact</text><text x="388.000" y="641" class="val">0 (0.0%)</text><rect x="35" y="699" width="1130" height="265" fill="white" stroke="#cbd5dd" /><text x="55" y="729" class="head">C. Safeguard mechanism status</text><line x1="380.000" y1="759" x2="380.000" y2="941" stroke="#d9e1e8" /><text x="373.000" y="752" class="note">0</text><line x1="591.667" y1="759" x2="591.667" y2="941" stroke="#d9e1e8" /><text x="584.667" y="752" class="note">18</text><line x1="803.333" y1="759" x2="803.333" y2="941" stroke="#d9e1e8" /><text x="796.333" y="752" class="note">36</text><line x1="1015.000" y1="759" x2="1015.000" y2="941" stroke="#d9e1e8" /><text x="1008.000" y="752" class="note">54</text><text x="55" y="781" class="lab">Reported</text><rect x="380" y="765" width="517.407" height="20" fill="#bd7734" /><text x="905.407" y="781" class="val">44 (81.5%)</text><text x="55" y="810" class="lab">Implemented</text><rect x="380" y="794" width="470.370" height="20" fill="#bd7734" /><text x="858.370" y="810" class="val">40 (74.1%)</text><text x="55" y="839" class="lab">Empirically evaluated</text><rect x="380" y="823" width="352.778" height="20" fill="#bd7734" /><text x="740.778" y="839" class="val">30 (55.6%)</text><text x="55" y="868" class="lab">Used in evaluated setting</text><rect x="380" y="852" width="470.370" height="20" fill="#bd7734" /><text x="858.370" y="868" class="val">40 (74.1%)</text><text x="55" y="897" class="lab">Confirmed real-world use</text><text x="388.000" y="897" class="val">0 (0.0%)</text><text x="50" y="1010" class="note">* Temporality percentages use 46 applicable reports; 8 Not applicable reports are excluded.</text><text x="50" y="1035" class="note">Other percentages use N=54. Categories may overlap. Zero means no confirmed positive classification.</text><text x="50" y="1060" class="note">Randomized user, reader and expert-rating evaluations are not patient randomized trials.</text></svg>